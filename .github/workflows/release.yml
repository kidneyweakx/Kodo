# Builds a signed release APK and attaches it to a GitHub Release.
#
# Trigger: push a tag like `v0.2.0`, or run manually from the Actions tab
# (manual runs upload the APK as a workflow artifact and, if a tag is given,
# publish a release for it).
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD      optional, defaults to the store password
# Without them the APK is signed with the debug key (installable, but it
# can't be upgraded in place by a properly signed build later).

name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.2.0). Leave empty to only build an artifact.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck + unit tests
        run: |
          ./scripts/gen-route-types.sh
          bunx tsc --noEmit
          bun test

      - name: Stamp version
        run: node scripts/set-version.js "${TAG:-v$(node -p "require('./package.json').version")}"

      - name: Generate native project
        run: |
          bunx expo prebuild --platform android --clean --no-install
          bunx nitrogen

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KODO_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — signing with the debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          KODO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KODO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KODO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          OUT="kodo-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Publish GitHub Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kodō ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
