# Checks on every push to main and every PR.
#
#   check    — typed routes, tsc, eslint, bun test (~1 min)
#   android  — prebuild + nitrogen + a single-ABI debug build, so Kotlin/C++
#              breakage is caught before a release tag instead of after it.
#              On main it also refreshes the Gradle cache that release.yml
#              restores (caches written on the default branch are the only
#              ones tag builds can read).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: ./scripts/gen-route-types.sh
      - run: bunx tsc --noEmit
      - run: bun lint
      - run: bun test

  android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json', 'nitro.json', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Generate native project
        run: |
          bunx expo prebuild --platform android --clean --no-install
          bunx nitrogen
      - name: Build debug APK (arm64)
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: kodo-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
